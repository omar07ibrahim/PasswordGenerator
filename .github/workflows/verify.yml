name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  core:
    name: Core contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the exact development stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -e ".[dev]"
          python -m pip check

      - name: Enforce lint and formatting
        run: make PYTHON=python lint

      - name: Enforce strict typing
        run: make PYTHON=python typecheck

      - name: Run the full coverage gate
        run: make PYTHON=python test

      - name: Verify the committed evidence inventory
        run: |
          make \
            PYTHON=python \
            EVIDENCE_WORK="$RUNNER_TEMP/evidence-work" \
            evidence-check

      - name: Confirm verification left tracked files unchanged
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"

  distribution:
    name: Canonical distribution contract (Python 3.12.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
  
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Set up the canonical Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
  
      - name: Install the attested build boundary
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            "build==1.5.0" \
            "setuptools==83.0.0" \
            "Flask==3.1.3" \
            "waitress==3.0.2"
          python -m pip check
  
      - name: Rebuild and verify the canonical artifacts
        run: |
          mkdir -p .evidence-work/distribution
          python -B scripts/attest_distribution.py \
            --format json \
            --root "$GITHUB_WORKSPACE" \
            --work-root .evidence-work/distribution \
            > "$RUNNER_TEMP/distribution-attestation.json"
          {
            printf '%s\n' '$ python scripts/attest_distribution.py'
            python -B scripts/attest_distribution.py \
              --format text \
              --root "$GITHUB_WORKSPACE" \
              --work-root .evidence-work/distribution
          } > "$RUNNER_TEMP/distribution-check.txt"
          cmp \
            "$RUNNER_TEMP/distribution-attestation.json" \
            docs/evidence/distribution-attestation.json
          cmp \
            "$RUNNER_TEMP/distribution-check.txt" \
            docs/evidence/distribution-check.txt
  
      - name: Confirm attestation left tracked files unchanged
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"

  visual-evidence:
    name: Real browser evidence replay (Python 3.12.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
  
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Set up the canonical Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
  
      - name: Install the exact evidence stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -e ".[dev]"
          python -m pip check
  
      - name: Provision the pinned Chromium build
        run: make PYTHON=python evidence-browser
  
      - name: Recapture every raw and visual artifact
        id: recapture
        run: |
          make PYTHON=python evidence
          make PYTHON=python evidence-check
  
      - name: Require byte-identical evidence and a clean checkout
        id: byte_check
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
  
      - name: Verify regenerated evidence drift is reviewable
        id: drift_inventory
        if: ${{ always() && steps.recapture.outcome == 'success' && steps.byte_check.outcome == 'failure' }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path, PurePosixPath

          manifest_path = Path("docs/evidence/manifest.json")
          manifest_name = manifest_path.as_posix()

          try:
              document = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("regenerated evidence manifest is invalid") from exc
          if type(document) is not dict:
              raise SystemExit("regenerated evidence manifest root is invalid")
          records = document.get("artifacts")
          if type(records) is not list or not records:
              raise SystemExit("regenerated evidence manifest has no artifacts")

          artifact_paths: set[str] = set()
          for record in records:
              if type(record) is not dict or type(record.get("path")) is not str:
                  raise SystemExit("regenerated evidence manifest path is invalid")
              value = record["path"]
              pure = PurePosixPath(value)
              if (
                  value != pure.as_posix()
                  or pure.is_absolute()
                  or any(part in {"", ".", ".."} for part in pure.parts)
                  or len(pure.parts) < 3
                  or tuple(pure.parts[:2])
                  not in {("docs", "assets"), ("docs", "evidence")}
                  or value == manifest_name
                  or value in artifact_paths
              ):
                  raise SystemExit("regenerated evidence manifest path is unsafe")
              candidate = Path(*pure.parts)
              if candidate.is_symlink() or not candidate.is_file():
                  raise SystemExit("regenerated evidence artifact is not a regular file")
              artifact_paths.add(value)

          allowed_paths = artifact_paths | {manifest_name}
          candidate_paths: set[str] = set()
          for directory_name in ("docs/assets", "docs/evidence"):
              directory = Path(directory_name)
              if directory.is_symlink() or not directory.is_dir():
                  raise SystemExit("generated evidence directory is invalid")
              for candidate in directory.rglob("*"):
                  if candidate.is_symlink():
                      raise SystemExit("generated evidence candidate contains a symlink")
                  if candidate.is_dir():
                      continue
                  if not candidate.is_file():
                      raise SystemExit(
                          "generated evidence candidate contains a non-file"
                      )
                  candidate_paths.add(candidate.as_posix())
          if candidate_paths != allowed_paths:
              raise SystemExit(
                  "generated evidence candidate does not match the manifest"
              )

          def git_paths(*arguments: str) -> set[str]:
              result = subprocess.run(
                  ("git", *arguments),
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              payload = result.stdout
              if payload and not payload.endswith(b"\0"):
                  raise SystemExit("Git returned an invalid path inventory")
              try:
                  return {
                      item.decode("utf-8")
                      for item in payload.split(b"\0")[:-1]
                  }
              except UnicodeError as exc:
                  raise SystemExit("Git returned a non-UTF-8 path") from exc

          dirty_paths = git_paths("diff", "--name-only", "-z", "--")
          dirty_paths |= git_paths("diff", "--cached", "--name-only", "-z", "--")
          dirty_paths |= git_paths(
              "ls-files", "--others", "--exclude-standard", "-z", "--"
          )
          if not dirty_paths:
              raise SystemExit("evidence drift inventory is empty")
          if not dirty_paths.issubset(allowed_paths):
              raise SystemExit("evidence drift escapes the evidence candidate set")
          PY

      - name: Preserve the complete generated evidence candidate for review
        if: ${{ always() && steps.drift_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evidence-candidate-${{ github.run_id }}
          path: |
            docs/assets/
            docs/evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
