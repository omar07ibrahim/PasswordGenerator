name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  core:
    name: Core contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the exact development stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -e ".[dev]"
          python -m pip check

      - name: Enforce lint and formatting
        run: make PYTHON=python lint

      - name: Enforce strict typing
        run: make PYTHON=python typecheck

      - name: Run the full coverage gate
        run: make PYTHON=python test

      - name: Verify the committed evidence inventory
        run: |
          make \
            PYTHON=python \
            EVIDENCE_WORK="$RUNNER_TEMP/evidence-work" \
            evidence-check

      - name: Confirm verification left tracked files unchanged
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"

  distribution:
    name: Canonical distribution contract (Python 3.12.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
  
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Set up the canonical Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
  
      - name: Install the attested build boundary
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            "build==1.5.0" \
            "setuptools==83.0.0" \
            "Flask==3.1.3" \
            "waitress==3.0.2"
          python -m pip check
  
      - name: Rebuild and verify the canonical artifacts
        run: |
          mkdir -p .evidence-work/distribution
          python -B scripts/attest_distribution.py \
            --format json \
            --root "$GITHUB_WORKSPACE" \
            --work-root .evidence-work/distribution \
            > "$RUNNER_TEMP/distribution-attestation.json"
          {
            printf '%s\n' '$ python scripts/attest_distribution.py'
            python -B scripts/attest_distribution.py \
              --format text \
              --root "$GITHUB_WORKSPACE" \
              --work-root .evidence-work/distribution
          } > "$RUNNER_TEMP/distribution-check.txt"
          cmp \
            "$RUNNER_TEMP/distribution-attestation.json" \
            docs/evidence/distribution-attestation.json
          cmp \
            "$RUNNER_TEMP/distribution-check.txt" \
            docs/evidence/distribution-check.txt
  
      - name: Confirm attestation left tracked files unchanged
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"

  visual-evidence:
    name: Real browser evidence replay (Python 3.12.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
  
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Set up the canonical Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
  
      - name: Install the exact evidence stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -e ".[dev]"
          python -m pip check
  
      - name: Provision the pinned Chromium build
        run: make PYTHON=python evidence-browser
  
      - name: Recapture every raw and visual artifact
        run: |
          make PYTHON=python evidence
          make PYTHON=python evidence-check
  
      - name: Require byte-identical evidence and a clean checkout
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
  
      - name: Preserve browser evidence drift for review
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-drift-${{ github.run_id }}
          path: |
            docs/assets/web-home-mobile.png
            docs/assets/web-home.png
            docs/assets/web-invalid-length.png
            docs/assets/web-validation-demo.gif
            docs/evidence/manifest.json
            docs/evidence/web-validation-reference.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0