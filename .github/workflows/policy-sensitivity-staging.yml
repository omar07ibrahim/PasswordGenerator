name: Policy sensitivity staging

on:
  push:
    branches:
      - portfolio/policy-sensitivity-evidence

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  core:
    name: Sensitivity core contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Install the exact development stack
        run: |
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"
          python -m pip check

      - name: Verify formatting typing tests and coverage
        run: |
          make PYTHON=python lint
          make PYTHON=python typecheck
          PYTHONPATH=src python -m pytest \
            --ignore=tests/test_evidence.py \
            --cov=password_policy_lab \
            --cov-branch \
            --cov-report=term-missing \
            -q

      - name: Require a clean checkout
        run: |
          git diff --exit-code -- .
          test -z "$(git status --short --untracked-files=all)"
