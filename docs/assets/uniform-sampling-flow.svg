<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title description">
  <title id="title">Exact uniform sampling flow</title>
  <desc id="description">A validated policy is counted exactly, one uniform rank is selected, and deterministic unranking returns the candidate.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63e6d2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c95d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .title { fill: #edf5f1; font: 700 42px system-ui, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #9fb4ad; font: 400 20px system-ui, sans-serif; }
      .lane { fill: #63e6d2; font: 700 15px ui-monospace, monospace; letter-spacing: 2px; }
      .node-title { fill: #edf5f1; font: 700 22px system-ui, sans-serif; }
      .node-detail { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
      .node-code { fill: #f4c95d; font: 600 15px ui-monospace, monospace; }
      .step { fill: #0a1014; font: 800 15px ui-monospace, monospace; }
      .caption { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="650" rx="28" fill="#0a1014"/>
  <path d="M0 0 H1600 V650 H0 Z" fill="none" stroke="#36505a" stroke-width="2"/>
  <text x="55" y="82" class="title">Uniform sampling is rank selection, not trial and error</text>
  <text x="55" y="120" class="subtitle">The generator verifies this exact call shape in PasswordSpace.sample_uniform before rendering.</text>
  <rect x="55" y="158" width="1490" height="48" rx="24" fill="#17262d" stroke="#36505a"/>
  <text x="800" y="190" text-anchor="middle" class="node-code">return self.unrank(secrets.randbelow(self._total))</text>
  <g filter="url(#shadow)">
    <rect x="55" y="250" width="270" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="55" y="250" width="8" height="154" rx="4" fill="#63e6d2"/>
    <circle cx="89" cy="284" r="17" fill="#63e6d2"/>
    <text x="89" y="289" text-anchor="middle" class="step">1</text>
    <text x="117" y="291" class="node-title">Validated policy</text>
    <text x="81" y="326" class="node-detail">
      <tspan x="81" dy="0">ordered classes</tspan>
      <tspan x="81" dy="24">fixed minima</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="370" y="250" width="270" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="370" y="250" width="8" height="154" rx="4" fill="#63e6d2"/>
    <circle cx="404" cy="284" r="17" fill="#63e6d2"/>
    <text x="404" y="289" text-anchor="middle" class="step">2</text>
    <text x="432" y="291" class="node-title">Exact DP count</text>
    <text x="396" y="326" class="node-detail">
      <tspan x="396" dy="0">total valid strings</tspan>
      <tspan x="396" dy="24">no enumeration</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="685" y="250" width="270" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="685" y="250" width="8" height="154" rx="4" fill="#f4c95d"/>
    <circle cx="719" cy="284" r="17" fill="#f4c95d"/>
    <text x="719" y="289" text-anchor="middle" class="step">3</text>
    <text x="747" y="291" class="node-title">Uniform rank</text>
    <text x="711" y="326" class="node-detail">
      <tspan x="711" dy="0">secrets.randbelow(total)</tspan>
      <tspan x="711" dy="24">one application-level call</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1000" y="250" width="270" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1000" y="250" width="8" height="154" rx="4" fill="#f4c95d"/>
    <circle cx="1034" cy="284" r="17" fill="#f4c95d"/>
    <text x="1034" y="289" text-anchor="middle" class="step">4</text>
    <text x="1062" y="291" class="node-title">Exact unrank</text>
    <text x="1026" y="326" class="node-detail">
      <tspan x="1026" dy="0">block subtraction</tspan>
      <tspan x="1026" dy="24">stable bijection</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1315" y="250" width="270" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1315" y="250" width="8" height="154" rx="4" fill="#63e6d2"/>
    <circle cx="1349" cy="284" r="17" fill="#63e6d2"/>
    <text x="1349" y="289" text-anchor="middle" class="step">5</text>
    <text x="1377" y="291" class="node-title">Valid candidate</text>
    <text x="1341" y="326" class="node-detail">
      <tspan x="1341" dy="0">probability 1 / total</tspan>
      <tspan x="1341" dy="24">no project rejection loop</tspan>
    </text>
  </g>
  <g><path d="M325 327 H370" fill="none" stroke="#63e6d2" stroke-width="4" marker-end="url(#arrow-teal)"/><path d="M640 327 H685" fill="none" stroke="#f4c95d" stroke-width="4" marker-end="url(#arrow-gold)"/><path d="M955 327 H1000" fill="none" stroke="#63e6d2" stroke-width="4" marker-end="url(#arrow-teal)"/><path d="M1270 327 H1315" fill="none" stroke="#63e6d2" stroke-width="4" marker-end="url(#arrow-teal)"/></g>
  <rect x="180" y="478" width="1240" height="126" rx="16" fill="#17262d" stroke="#36505a"/>
  <text x="800" y="528" text-anchor="middle" class="node-title">Every valid string owns exactly one rank</text>
  <text x="800" y="558" text-anchor="middle" class="caption">Project code has no candidate-rejection loop; the application makes one secrets.randbelow(total) call.</text>
  <text x="800" y="584" text-anchor="middle" class="caption">The standard-library implementation may internally reject random-bit draws.</text>
</svg>
