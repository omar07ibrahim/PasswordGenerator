    <text x="78" y="497" class="node-code">product 24 calls · 57,624 vectors · consume 124,848</text>
    <rect x="470" y="423" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="470" y="423" width="260" height="18" rx="9" fill="#63e6d2"/>
    <text x="470" y="470" class="node-detail">31,213 occupied / 60,025 bound</text>
    <rect x="1125" y="423" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="1125" y="423" width="260" height="18" rx="9" fill="#63e6d2"/>
    <text x="1125" y="470" class="node-detail">124,848 calls / 240,100 bound</text>
