    <text x="78" y="560" class="node-title">Skewed strict minima</text>
    <text x="78" y="590" class="node-detail">L=24 · minima 21 / 1 / 1 / 1</text>
    <text x="78" y="617" class="node-code">product 24 calls · 4,224 vectors · consume 9,148</text>
    <rect x="470" y="543" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="470" y="543" width="260" height="18" rx="9" fill="#63e6d2"/>
    <text x="470" y="590" class="node-detail">2,288 occupied / 4,400 bound</text>
    <rect x="1125" y="543" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="1125" y="543" width="260" height="18" rx="9" fill="#63e6d2"/>
    <text x="1125" y="590" class="node-detail">9,148 calls / 17,600 bound</text>
  </g>  <g id="dp-work-near-budget-eight-class-32" role="group" aria-label="Eight-class budget edge; length 32; occupied cells 164025; cell bound 216513; transition calls 1312192; transition bound 1732104">
    <rect x="55" y="648" width="1690" height="105" rx="15" fill="#111c21" stroke="#36505a"/>
    <text x="78" y="680" class="node-title">Eight-class budget edge</text>
