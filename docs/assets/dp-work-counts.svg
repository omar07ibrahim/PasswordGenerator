    <text x="78" y="737" class="node-code">product 32 calls · 209,952 vectors · consume 1,312,192</text>
    <rect x="470" y="663" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="470" y="663" width="379" height="18" rx="9" fill="#63e6d2"/>
    <text x="470" y="710" class="node-detail">164,025 occupied / 216,513 bound</text>
    <rect x="1125" y="663" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="1125" y="663" width="379" height="18" rx="9" fill="#63e6d2"/>
    <text x="1125" y="710" class="node-detail">1,312,192 calls / 1,732,104 bound</text>
  </g>  <g id="dp-work-arbitrary-precision-one-class-256" role="group" aria-label="Arbitrary-precision depth; length 256; occupied cells 33153; cell bound 66049; transition calls 33152; transition bound 66049">
    <rect x="55" y="768" width="1690" height="105" rx="15" fill="#111c21" stroke="#36505a"/>
    <text x="78" y="800" class="node-title">Arbitrary-precision depth</text>
    <text x="78" y="830" class="node-detail">L=256 · minima 256</text>
    <text x="78" y="857" class="node-code">product 256 calls · 65,792 vectors · consume 33,152</text>
    <rect x="470" y="783" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="470" y="783" width="251" height="18" rx="9" fill="#63e6d2"/>
    <text x="470" y="830" class="node-detail">33,153 occupied / 66,049 bound</text>
    <rect x="1125" y="783" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="1125" y="783" width="251" height="18" rx="9" fill="#63e6d2"/>
    <text x="1125" y="830" class="node-detail">33,152 calls / 66,049 bound</text>
  </g>  <g id="dp-work-rejected-eight-class-32" role="group" aria-label="Fail-fast budget guard; length 32; occupied cells 0; cell bound 2162688; transition calls 0; transition bound 17301504">
    <rect x="55" y="888" width="1690" height="105" rx="15" fill="#111c21" stroke="#36505a"/>
    <text x="78" y="920" class="node-title">Fail-fast budget guard</text>
    <text x="78" y="950" class="node-detail">L=32 · minima 3 / 3 / 3 / 3 / 3 / 3 / 3 / 3</text>
    <text x="78" y="977" class="node-code">product 0 calls · 0 vectors · consume 0</text>
    <rect x="470" y="903" width="500" height="18" rx="9" fill="#17262d" stroke="#f4c95d" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="470" y="950" class="node-detail">preflight stop · bound 2,162,688 / budget 250,000</text>
    <rect x="1125" y="903" width="500" height="18" rx="9" fill="#17262d" stroke="#f4c95d" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="1125" y="950" class="node-detail">preflight stop · bound 17,301,504 / budget 2,000,000</text>
  </g>
  <text x="70" y="1075" class="caption">Bars encode exact observed-to-bound ratios; every raw integer remains printed beside its bar.</text>
  <text x="1730" y="1075" text-anchor="end" class="node-code">rejected case: product 0 · consume 0</text>
</svg>
