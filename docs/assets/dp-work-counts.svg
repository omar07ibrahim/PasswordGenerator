<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">Deterministic dynamic-programming work counts</title>
  <desc id="description">Six fixed password-policy cases compare exact logical occupied cells and transition calls with preflight bounds. The rejected case records no dynamic-programming enumeration.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63e6d2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c95d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .title { fill: #edf5f1; font: 700 42px system-ui, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #9fb4ad; font: 400 20px system-ui, sans-serif; }
      .lane { fill: #63e6d2; font: 700 15px ui-monospace, monospace; letter-spacing: 2px; }
      .node-title { fill: #edf5f1; font: 700 22px system-ui, sans-serif; }
      .node-detail { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
      .node-code { fill: #f4c95d; font: 600 15px ui-monospace, monospace; }
      .step { fill: #0a1014; font: 800 15px ui-monospace, monospace; }
      .caption { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1800" height="1120" rx="28" fill="#0a1014"/>
  <path d="M0 0 H1800 V1120 H0 Z" fill="none" stroke="#36505a" stroke-width="2"/>
  <text x="70" y="78" class="title">Logical DP work, measured without a stopwatch</text>
  <text x="70" y="118" class="subtitle">Five accepted policies expose actual table work; the sixth proves the preflight budget stops before enumeration.</text>
  <rect x="70" y="150" width="1660" height="74" rx="18" fill="#17262d" stroke="#36505a"/>
  <text x="100" y="182" class="lane">DETERMINISTIC COUNTER CONTRACT · cProfile CALL COUNTS + ITERATOR COUNTERS</text>
  <text x="100" y="208" class="caption">Logical operations only · no elapsed time · no RSS · no hardware performance claim</text>
  <text x="470" y="270" class="lane">OCCUPIED DP CELLS / RECTANGULAR BOUND</text>
  <text x="1125" y="270" class="lane">_CONSUME CALLS / TRANSITION BOUND</text>
  <g id="dp-work-default-visible-ascii-20" role="group" aria-label="Default visible ASCII; length 20; occupied cells 304; cell bound 336; transition calls 1212; transition bound 1344">
    <rect x="55" y="288" width="1690" height="105" rx="15" fill="#111c21" stroke="#36505a"/>
    <text x="78" y="320" class="node-title">Default visible ASCII</text>
    <text x="78" y="350" class="node-detail">L=20 · minima 1 / 1 / 1 / 1</text>
    <text x="78" y="377" class="node-code">product 20 calls · 320 vectors · consume 1,212</text>
    <rect x="470" y="303" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="470" y="303" width="452" height="18" rx="9" fill="#63e6d2"/>
    <text x="470" y="350" class="node-detail">304 occupied / 336 bound</text>
    <rect x="1125" y="303" width="500" height="18" rx="9" fill="#17262d" stroke="#36505a"/><rect x="1125" y="303" width="451" height="18" rx="9" fill="#63e6d2"/>
    <text x="1125" y="350" class="node-detail">1,212 calls / 1,344 bound</text>
  </g>  <g id="dp-work-balanced-visible-ascii-24" role="group" aria-label="Balanced strict minima; length 24; occupied cells 31213; cell bound 60025; transition calls 124848; transition bound 240100">
    <rect x="55" y="408" width="1690" height="105" rx="15" fill="#111c21" stroke="#36505a"/>
    <text x="78" y="440" class="node-title">Balanced strict minima</text>
