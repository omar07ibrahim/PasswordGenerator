<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title description">
  <title id="title">Password Policy State-Space Lab architecture</title>
  <desc id="description">A local browser and a deterministic CLI converge on one exact policy, dynamic-programming, and inspection core.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63e6d2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c95d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .title { fill: #edf5f1; font: 700 42px system-ui, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #9fb4ad; font: 400 20px system-ui, sans-serif; }
      .lane { fill: #63e6d2; font: 700 15px ui-monospace, monospace; letter-spacing: 2px; }
      .node-title { fill: #edf5f1; font: 700 22px system-ui, sans-serif; }
      .node-detail { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
      .node-code { fill: #f4c95d; font: 600 15px ui-monospace, monospace; }
      .step { fill: #0a1014; font: 800 15px ui-monospace, monospace; }
      .caption { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="880" rx="28" fill="#0a1014"/>
  <path d="M0 0 H1600 V880 H0 Z" fill="none" stroke="#36505a" stroke-width="2"/>
  <text x="80" y="82" class="title">One exact core, two bounded interfaces</text>
  <text x="80" y="120" class="subtitle">Architecture recovered from imports and call sites in the shipped Python source.</text>
  <text x="80" y="178" class="lane">LOCAL WEB PATH</text>
  <text x="80" y="448" class="lane" fill="#f4c95d">DETERMINISTIC CLI PATH</text>
  <g filter="url(#shadow)">
    <rect x="55" y="210" width="230" height="132" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="55" y="210" width="8" height="132" rx="4" fill="#63e6d2"/>
    <circle cx="89" cy="244" r="17" fill="#63e6d2"/>
    <text x="89" y="249" text-anchor="middle" class="step">1</text>
    <text x="117" y="251" class="node-title">Browser</text>
    <text x="81" y="286" class="node-detail">
      <tspan x="81" dy="0">server-rendered HTML</tspan>
      <tspan x="81" dy="24">same-origin CSS only</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="330" y="210" width="230" height="132" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="330" y="210" width="8" height="132" rx="4" fill="#63e6d2"/>
    <circle cx="364" cy="244" r="17" fill="#63e6d2"/>
    <text x="364" y="249" text-anchor="middle" class="step">2</text>
    <text x="392" y="251" class="node-title">Waitress</text>
    <text x="356" y="286" class="node-detail">
      <tspan x="356" dy="0">127.0.0.1 listener</tspan>
      <tspan x="356" dy="24">bounded WSGI requests</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="605" y="210" width="300" height="132" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="605" y="210" width="8" height="132" rx="4" fill="#63e6d2"/>
    <circle cx="639" cy="244" r="17" fill="#63e6d2"/>
    <text x="639" y="249" text-anchor="middle" class="step">3</text>
    <text x="667" y="251" class="node-title">Flask validation</text>
    <text x="631" y="286" class="node-detail">
      <tspan x="631" dy="0">parse one bounded length</tspan>
      <tspan x="631" dy="24">invalid → HTTP 400 stop</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="55" y="480" width="300" height="132" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="55" y="480" width="8" height="132" rx="4" fill="#f4c95d"/>
    <circle cx="89" cy="514" r="17" fill="#f4c95d"/>
    <text x="89" y="519" text-anchor="middle" class="step">1</text>
    <text x="117" y="521" class="node-title">Strict CLI parser</text>
    <text x="81" y="556" class="node-detail">
      <tspan x="81" dy="0">inspect + sweep</tspan>
      <tspan x="81" dy="24">value-safe failures</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="605" y="430" width="300" height="132" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="605" y="430" width="8" height="132" rx="4" fill="#f4c95d"/>
    <circle cx="639" cy="464" r="17" fill="#f4c95d"/>
    <text x="639" y="469" text-anchor="middle" class="step">4</text>
    <text x="667" y="471" class="node-title">PasswordPolicy</text>
    <text x="631" y="506" class="node-detail">
      <tspan x="631" dy="0">visible-ascii-v1</tspan>
      <tspan x="631" dy="24">four disjoint classes</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="965" y="335" width="300" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="965" y="335" width="8" height="154" rx="4" fill="#f4c95d"/>
    <circle cx="999" cy="369" r="17" fill="#f4c95d"/>
    <text x="999" y="374" text-anchor="middle" class="step">5</text>
    <text x="1027" y="376" class="node-title">PasswordSpace</text>
    <text x="991" y="411" class="node-detail">
      <tspan x="991" dy="0">bounded bottom-up DP</tspan>
      <tspan x="991" dy="24">rank ↔ candidate bijection</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1325" y="190" width="230" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1325" y="190" width="8" height="154" rx="4" fill="#63e6d2"/>
    <circle cx="1359" cy="224" r="17" fill="#63e6d2"/>
    <text x="1359" y="229" text-anchor="middle" class="step">6</text>
    <text x="1387" y="231" class="node-title">Inspection</text>
    <text x="1351" y="266" class="node-detail">
      <tspan x="1351" dy="0">cardinalities</tspan>
      <tspan x="1351" dy="24">fingerprint + bounds</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1325" y="410" width="230" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1325" y="410" width="8" height="154" rx="4" fill="#63e6d2"/>
    <circle cx="1359" cy="444" r="17" fill="#63e6d2"/>
    <text x="1359" y="449" text-anchor="middle" class="step">7</text>
    <text x="1387" y="451" class="node-title">Audit output</text>
    <text x="1351" y="486" class="node-detail">
      <tspan x="1351" dy="0">Jinja audit panel</tspan>
      <tspan x="1351" dy="24">CLI text / JSON / CSV</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="965" y="650" width="300" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="965" y="650" width="8" height="154" rx="4" fill="#f4c95d"/>
    <circle cx="999" cy="684" r="17" fill="#f4c95d"/>
    <text x="999" y="689" text-anchor="middle" class="step">P</text>
    <text x="1027" y="691" class="node-title">Valid POST only</text>
    <text x="991" y="726" class="node-detail">
      <tspan x="991" dy="0">one application-level</tspan>
      <tspan x="991" dy="24">secrets.randbelow(total) call</tspan>
      <tspan x="991" dy="24">deterministic unrank</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1325" y="650" width="230" height="154" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1325" y="650" width="8" height="154" rx="4" fill="#f4c95d"/>
    <circle cx="1359" cy="684" r="17" fill="#f4c95d"/>
    <text x="1359" y="689" text-anchor="middle" class="step">8</text>
    <text x="1387" y="691" class="node-title">HTML response</text>
    <text x="1351" y="726" class="node-detail">
      <tspan x="1351" dy="0">candidate response</tspan>
      <tspan x="1351" dy="24">no persistence</tspan>
    </text>
  </g>

  <g fill="none" stroke="#63e6d2" stroke-width="4" marker-end="url(#arrow-teal)">
    <path d="M285 276 H330"/>
    <path d="M560 276 H605"/>
    <path d="M755 342 V430"/>
    <path d="M1265 380 C1305 380 1290 267 1325 267"/>
    <path d="M1440 344 V410"/>
  </g>
  <g fill="none" stroke="#f4c95d" stroke-width="4" marker-end="url(#arrow-gold)">
    <path d="M355 546 H605"/>
    <path d="M905 496 C940 496 925 445 965 430"/>
    <path d="M1115 489 V650"/>
    <path d="M1265 727 H1325"/>
  </g>

  <text x="1095" y="625" text-anchor="end" class="node-code">valid POST sampling edge</text>
  <rect x="55" y="690" width="850" height="104" rx="16" fill="#17262d" stroke="#36505a"/>
  <text x="85" y="731" class="node-title">Invalid web request</text>
  <text x="85" y="765" class="caption">Returns before profile or PasswordSpace construction; inspection remains withheld.</text>
  <path d="M650 342 C600 375 540 390 500 390 H24 V742 H55" fill="none" stroke="#f4c95d" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow-gold)"/>
</svg>
