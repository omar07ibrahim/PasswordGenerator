<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850" role="img" aria-labelledby="title description">
  <title id="title">Exact one-step password-policy minimum sensitivity</title>
  <desc id="description">Four exact bars show how many valid length-twenty visible-ASCII strings are added when one class minimum is lowered from one to zero. Effects are explicitly non-additive and entropy-free.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63e6d2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c95d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .title { fill: #edf5f1; font: 700 42px system-ui, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #9fb4ad; font: 400 20px system-ui, sans-serif; }
      .lane { fill: #63e6d2; font: 700 15px ui-monospace, monospace; letter-spacing: 2px; }
      .node-title { fill: #edf5f1; font: 700 22px system-ui, sans-serif; }
      .node-detail { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
      .node-code { fill: #f4c95d; font: 600 15px ui-monospace, monospace; }
      .step { fill: #0a1014; font: 800 15px ui-monospace, monospace; }
      .caption { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1800" height="850" rx="28" fill="#0a1014"/>
  <path d="M0 0 H1800 V850 H0 Z" fill="none" stroke="#36505a" stroke-width="2"/>
  <text x="70" y="78" class="title">One-step minimum sensitivity · exact state-space impact</text>
  <text x="70" y="118" class="subtitle">Length 20 · lower exactly one class minimum from 1 to 0 while every other policy field stays fixed.</text>
  <rect x="70" y="150" width="1660" height="78" rx="18" fill="#111c21" stroke="#36505a"/>
  <text x="100" y="182" class="lane">BASELINE VALID STRINGS</text>
  <text x="100" y="211" class="node-code">2,585,908,648,140,078,948,280,078,326,668,093,030,400</text>
  <text x="1688" y="183" text-anchor="end" class="caption">policy …f200806d498cb950</text>
  <text x="350" y="252" class="lane">ADDED IF THIS ONE MINIMUM IS RELAXED · BARS NORMALIZED TO LARGEST EXACT COUNT</text>
  <g id="sensitivity-lower" role="group" aria-label="lower; minimum one to zero; added 4282773611815523203733351229397401600; relaxed valid 2590191421751894471483811677897490432000">
    <text x="80" y="294" class="node-title">lower</text>
    <text x="80" y="323" class="node-code">minimum 1 → 0</text>
    <rect x="350" y="270" width="710" height="32" rx="16" fill="#17262d" stroke="#36505a"/>
    <rect x="350" y="270" width="9" height="32" rx="16" fill="#63e6d2"/>
    <text x="1095" y="294" class="node-code">+4,282,773,611,815,523,203,733,351,229,397,401,600</text>
    <text x="1095" y="323" class="node-detail">relaxed total 2,590,191,421,751,894,471,483,811,677,897,490,432,000</text>
    <text x="1095" y="348" class="caption">baseline numerator 49525148253325618764336927</text>
    <text x="1095" y="371" class="caption">relaxed denominator 49607171645069620101600410</text>
  </g>  <g id="sensitivity-upper" role="group" aria-label="upper; minimum one to zero; added 4282773611815523203733351229397401600; relaxed valid 2590191421751894471483811677897490432000">
