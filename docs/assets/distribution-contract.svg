<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="830" viewBox="0 0 1960 830" role="img" aria-labelledby="title description">
  <title id="title">Reproducible distribution attestation flow</title>
  <desc id="description">Fifteen immutable Git inputs feed two builds, canonical wheel and source archives, a source-archive rebuild, and an installed deterministic inspection smoke test.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63e6d2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c95d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .title { fill: #edf5f1; font: 700 42px system-ui, sans-serif; letter-spacing: -1px; }
      .subtitle { fill: #9fb4ad; font: 400 20px system-ui, sans-serif; }
      .lane { fill: #63e6d2; font: 700 15px ui-monospace, monospace; letter-spacing: 2px; }
      .node-title { fill: #edf5f1; font: 700 22px system-ui, sans-serif; }
      .node-detail { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
      .node-code { fill: #f4c95d; font: 600 15px ui-monospace, monospace; }
      .step { fill: #0a1014; font: 800 15px ui-monospace, monospace; }
      .caption { fill: #9fb4ad; font: 400 16px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1960" height="830" rx="28" fill="#0a1014"/>
  <path d="M0 0 H1960 V830 H0 Z" fill="none" stroke="#36505a" stroke-width="2"/>
  <text x="55" y="76" class="title">The release archive is measured, normalized, rebuilt, then installed</text>
  <text x="55" y="116" class="subtitle">Every value comes from the real project-specific attestation; raw backend artifacts are never presented as canonical releases.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="205" width="310" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="55" y="205" width="8" height="162" rx="4" fill="#63e6d2"/>
    <circle cx="89" cy="239" r="17" fill="#63e6d2"/>
    <text x="89" y="244" text-anchor="middle" class="step">1</text>
    <text x="117" y="246" class="node-title">Immutable inputs</text>
    <text x="81" y="281" class="node-detail">
      <tspan x="81" dy="0">15 stage-zero Git blobs</tspan>
      <tspan x="81" dy="24">sha256 bbb381861048c02e…</tspan>
      <tspan x="81" dy="24">normalized modes + mtime</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="430" y="205" width="310" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="430" y="205" width="8" height="162" rx="4" fill="#63e6d2"/>
    <circle cx="464" cy="239" r="17" fill="#63e6d2"/>
    <text x="464" y="244" text-anchor="middle" class="step">2</text>
    <text x="492" y="246" class="node-title">Build A + B</text>
    <text x="456" y="281" class="node-detail">
      <tspan x="456" dy="0">setuptools 83.0.0</tspan>
      <tspan x="456" dy="24">fixed epoch · umask 0022</tspan>
      <tspan x="456" dy="24">package index disabled</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="805" y="145" width="350" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="805" y="145" width="8" height="162" rx="4" fill="#f4c95d"/>
    <circle cx="839" cy="179" r="17" fill="#f4c95d"/>
    <text x="839" y="184" text-anchor="middle" class="step">3W</text>
    <text x="867" y="186" class="node-title">Canonical wheel</text>
    <text x="831" y="221" class="node-detail">
      <tspan x="831" dy="0">17 exact members · 0644</tspan>
      <tspan x="831" dy="24">sha256 180895b87076139e…</tspan>
      <tspan x="831" dy="24">two raw wheels byte-equal</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="805" y="380" width="350" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="805" y="380" width="8" height="162" rx="4" fill="#f4c95d"/>
    <circle cx="839" cy="414" r="17" fill="#f4c95d"/>
    <text x="839" y="419" text-anchor="middle" class="step">3S</text>
    <text x="867" y="421" class="node-title">Canonical sdist</text>
    <text x="831" y="456" class="node-detail">
      <tspan x="831" dy="0">23 files + 6 directories</tspan>
      <tspan x="831" dy="24">sha256 24c3db57d23e930f…</tspan>
      <tspan x="831" dy="24">raw sdist equality unclaimed</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1220" y="265" width="310" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1220" y="265" width="8" height="162" rx="4" fill="#63e6d2"/>
    <circle cx="1254" cy="299" r="17" fill="#63e6d2"/>
    <text x="1254" y="304" text-anchor="middle" class="step">4</text>
    <text x="1282" y="306" class="node-title">Sdist rebuild</text>
    <text x="1246" y="341" class="node-detail">
      <tspan x="1246" dy="0">safe manual materialization</tspan>
      <tspan x="1246" dy="24">canonical wheel byte-equal</tspan>
      <tspan x="1246" dy="24">no extractall</tspan>
    </text>
  </g>  <g filter="url(#shadow)">
    <rect x="1595" y="265" width="310" height="162" rx="18" fill="#111c21" stroke="#36505a" stroke-width="2"/>
    <rect x="1595" y="265" width="8" height="162" rx="4" fill="#63e6d2"/>
    <circle cx="1629" cy="299" r="17" fill="#63e6d2"/>
    <text x="1629" y="304" text-anchor="middle" class="step">5</text>
    <text x="1657" y="306" class="node-title">Installed smoke</text>
    <text x="1621" y="341" class="node-detail">
      <tspan x="1621" dy="0">offline pip --target</tspan>
      <tspan x="1621" dy="24">external cwd + exact origin</tspan>
      <tspan x="1621" dy="24">inspect only · no sample</tspan>
    </text>
  </g>

  <g fill="none" stroke="#63e6d2" stroke-width="4" marker-end="url(#arrow-teal)">
    <path d="M365 286 H430"/>
    <path d="M740 286 C770 286 775 226 805 226"/>
    <path d="M740 286 C770 286 775 461 805 461"/>
    <path d="M1155 461 C1185 461 1190 346 1220 346"/>
    <path d="M1530 346 H1595"/>
  </g>
  <path d="M1155 226 C1185 226 1190 316 1220 316" fill="none" stroke="#f4c95d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-gold)"/>

  <rect x="55" y="625" width="1850" height="150" rx="18" fill="#17262d" stroke="#36505a" stroke-width="2"/>
  <text x="85" y="670" class="node-title">Claim boundary</text>
  <text x="85" y="708" class="caption">No license, signature, dependency-integrity, cross-platform, or arbitrary-archive guarantee.</text>
  <text x="85" y="742" class="caption">The smoke uses current pinned checker dependencies; it is not a fresh dependency environment.</text>
  <text x="1855" y="742" text-anchor="end" class="node-code">official: false</text>
</svg>
