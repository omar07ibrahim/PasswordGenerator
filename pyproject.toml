[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-policy-state-space"
version = "0.1.0"
description = "Exact counting and uniform sampling for constrained password policies"
authors = [{ name = "Omar Ibrahim" }]
readme = { file = "PACKAGE.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "waitress==3.0.2"]

[project.urls]
Repository = "https://github.com/omar07ibrahim/PasswordGenerator"
Issues = "https://github.com/omar07ibrahim/PasswordGenerator/issues"

[project.scripts]
password-policy-lab = "password_policy_lab.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.6.0",
    "matplotlib==3.11.1",
    "mypy==2.3.1",
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "playwright==1.62.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
password_policy_lab = ["py.typed", "static/*.css", "templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["password_policy_lab"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
